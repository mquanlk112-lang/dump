name: Build FF Tool Combined Rootless DEB

on:
  workflow_dispatch:
  push:
    branches:
      - devicescope-build
    paths:
      - 'DeviceScope/**'
      - 'DeviceScopeHUD/**'
      - '.github/workflows/build-devicescope.yml'

permissions:
  contents: read

concurrency:
  group: fftool-combined-deb-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-combined-deb:
    name: Build one app plus SpringBoard HUD package
    runs-on: macos-15
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: brew install xcodegen dpkg ldid xz

      - name: Select Xcode and install Theos
        shell: bash
        run: |
          set -euo pipefail
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version
          SDK_PATH="$(xcrun --sdk iphoneos --show-sdk-path)"
          SDK_VERSION="$(xcrun --sdk iphoneos --show-sdk-version)"
          git clone --depth=1 --recursive https://github.com/theos/theos.git "$RUNNER_TEMP/theos"
          mkdir -p "$RUNNER_TEMP/theos/sdks"
          ln -s "$SDK_PATH" "$RUNNER_TEMP/theos/sdks/iPhoneOS${SDK_VERSION}.sdk"
          echo "THEOS=$RUNNER_TEMP/theos" >> "$GITHUB_ENV"
          echo "iOS SDK $SDK_VERSION: $SDK_PATH"

      - name: Generate app project
        working-directory: DeviceScope
        run: xcodegen generate --spec project.yml

      - name: Build FF Tool app for arm64
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild \
            -project DeviceScope/DeviceScope.xcodeproj \
            -scheme DeviceScope \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/DeviceScope-DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            clean build
          APP_PATH="$RUNNER_TEMP/DeviceScope-DerivedData/Build/Products/Release-iphoneos/DeviceScope.app"
          test -d "$APP_PATH"
          test -f "$APP_PATH/Info.plist"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP_PATH/Info.plist")" = "com.minhquandev.devicescope"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleDisplayName' "$APP_PATH/Info.plist")" = "FF Tool"
          test -d "$APP_PATH/PlugIns/DeviceScopeLiveActivity.appex"
          echo "APP_PATH=$APP_PATH" >> "$GITHUB_ENV"

      - name: Build rootless SpringBoard tweak
        working-directory: DeviceScopeHUD
        shell: bash
        run: |
          set -euo pipefail
          make package THEOS_PACKAGE_SCHEME=rootless FINALPACKAGE=1
          TWEAK_DEB="$(find packages -maxdepth 1 -type f -name '*.deb' -print -quit)"
          test -n "$TWEAK_DEB"
          echo "TWEAK_DEB=$GITHUB_WORKSPACE/DeviceScopeHUD/$TWEAK_DEB" >> "$GITHUB_ENV"

      - name: Combine app and tweak into one Debian package
        shell: bash
        run: |
          set -euo pipefail
          STAGE="$RUNNER_TEMP/FFTool-Combined-Root"
          rm -rf "$STAGE"
          mkdir -p "$STAGE/DEBIAN" "$STAGE/Applications"
          dpkg-deb -x "$TWEAK_DEB" "$STAGE"
          ditto "$APP_PATH" "$STAGE/Applications/FF Tool.app"

          # Sign app and embedded extension executables for jailbreak installation.
          while IFS= read -r -d '' FILE; do
            if file "$FILE" | grep -q 'Mach-O'; then
              ldid -S "$FILE"
            fi
          done < <(find "$STAGE/Applications/FF Tool.app" -type f -print0)

          cat > "$STAGE/DEBIAN/control" <<'EOF'
          Package: com.minhquandev.fftool
          Name: FF Tool + DeviceScope HUD
          Version: 2.0.0
          Architecture: iphoneos-arm64
          Description: FF Tool device dashboard and SpringBoard status HUD. No game process injection.
          Maintainer: Minh Quan Dev
          Author: Minh Quan Dev
          Section: Tweaks
          Depends: firmware (>= 15.0), mobilesubstrate
          EOF

          cat > "$STAGE/DEBIAN/postinst" <<'EOF'
          #!/bin/sh
          set -e
          if [ -x /usr/bin/uicache ]; then
            /usr/bin/uicache -p "/Applications/FF Tool.app" >/dev/null 2>&1 || true
          elif command -v uicache >/dev/null 2>&1; then
            uicache -p "/Applications/FF Tool.app" >/dev/null 2>&1 || true
          fi
          exit 0
          EOF

          cat > "$STAGE/DEBIAN/prerm" <<'EOF'
          #!/bin/sh
          if command -v notifyutil >/dev/null 2>&1; then
            notifyutil -p com.minhquandev.devicescope.hud.hide >/dev/null 2>&1 || true
          fi
          exit 0
          EOF

          cat > "$STAGE/DEBIAN/postrm" <<'EOF'
          #!/bin/sh
          if command -v uicache >/dev/null 2>&1; then
            uicache -u com.minhquandev.devicescope >/dev/null 2>&1 || true
          fi
          exit 0
          EOF
          chmod 755 "$STAGE/DEBIAN/postinst" "$STAGE/DEBIAN/prerm" "$STAGE/DEBIAN/postrm"

          mkdir -p "$GITHUB_WORKSPACE/out"
          dpkg-deb --root-owner-group --build "$STAGE" "$GITHUB_WORKSPACE/out/FFTool-Combined.deb"
          dpkg-deb --info "$GITHUB_WORKSPACE/out/FFTool-Combined.deb"
          dpkg-deb --contents "$GITHUB_WORKSPACE/out/FFTool-Combined.deb"
          dpkg-deb -c "$GITHUB_WORKSPACE/out/FFTool-Combined.deb" | grep -q 'Applications/FF Tool.app/Info.plist'
          dpkg-deb -c "$GITHUB_WORKSPACE/out/FFTool-Combined.deb" | grep -q 'var/jb/Library/MobileSubstrate/DynamicLibraries/DeviceScopeHUD.dylib'
          dpkg-deb -c "$GITHUB_WORKSPACE/out/FFTool-Combined.deb" | grep -q 'var/jb/Library/MobileSubstrate/DynamicLibraries/DeviceScopeHUD.plist'
          plutil -lint "$STAGE/var/jb/Library/MobileSubstrate/DynamicLibraries/DeviceScopeHUD.plist"
          shasum -a 256 "$GITHUB_WORKSPACE/out/FFTool-Combined.deb"

      - name: Upload single combined package
        uses: actions/upload-artifact@v4
        with:
          name: FFTool-Combined-DEB
          path: out/FFTool-Combined.deb
          if-no-files-found: error
          retention-days: 14
