name: Build FF Tool Single TIPA

on:
  workflow_dispatch:
  push:
    branches:
      - devicescope-build
    paths:
      - 'FFToolTIPA/**'
      - '.github/workflows/build-devicescope.yml'

permissions:
  contents: read

concurrency:
  group: fftool-tipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-tipa:
    name: Build one TrollStore TIPA with system HUD
    runs-on: macos-15
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install packaging tools
        run: brew install dpkg ldid xz

      - name: Install Theos and link iOS SDK
        shell: bash
        run: |
          set -euo pipefail
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version
          SDK_PATH="$(xcrun --sdk iphoneos --show-sdk-path)"
          SDK_VERSION="$(xcrun --sdk iphoneos --show-sdk-version)"
          git clone --depth=1 --recursive https://github.com/theos/theos.git "$RUNNER_TEMP/theos"
          mkdir -p "$RUNNER_TEMP/theos/sdks"
          ln -s "$SDK_PATH" "$RUNNER_TEMP/theos/sdks/iPhoneOS${SDK_VERSION}.sdk"
          echo "THEOS=$RUNNER_TEMP/theos" >> "$GITHUB_ENV"
          echo "Linked iOS SDK $SDK_VERSION"

      - name: Build FF Tool TIPA
        shell: bash
        run: |
          set -euo pipefail
          cd FFToolTIPA
          make package FINALPACKAGE=1
          test -s packages/FFTool.tipa
          unzip -t packages/FFTool.tipa
          unzip -Z1 packages/FFTool.tipa | grep -q '^Payload/FFTool.app/Info.plist$'
          unzip -Z1 packages/FFTool.tipa | grep -q '^Payload/FFTool.app/FFTool$'
          APP_INFO="$RUNNER_TEMP/FFTool-Info.plist"
          unzip -p packages/FFTool.tipa Payload/FFTool.app/Info.plist > "$APP_INFO"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP_INFO")" = "com.minhquandev.fftool"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleDisplayName' "$APP_INFO")" = "FF Tool"
          unzip -p packages/FFTool.tipa Payload/FFTool.app/FFTool > "$RUNNER_TEMP/FFTool-executable"
          lipo -archs "$RUNNER_TEMP/FFTool-executable" | tee "$RUNNER_TEMP/FFTool-archs.txt"
          grep -q 'arm64' "$RUNNER_TEMP/FFTool-archs.txt"
          ldid -e "$RUNNER_TEMP/FFTool-executable" > "$RUNNER_TEMP/FFTool-entitlements.plist"
          plutil -lint "$RUNNER_TEMP/FFTool-entitlements.plist"
          grep -q 'com.apple.private.persona-mgmt' "$RUNNER_TEMP/FFTool-entitlements.plist"
          grep -q 'com.apple.springboard.accessibility-window-hosting' "$RUNNER_TEMP/FFTool-entitlements.plist"
          shasum -a 256 packages/FFTool.tipa

      - name: Upload single TIPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: FFTool-TIPA
          path: FFToolTIPA/packages/FFTool.tipa
          if-no-files-found: error
          retention-days: 14
