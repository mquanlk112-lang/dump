name: Build NOVAKIT iOS IPA

on:
  workflow_dispatch:
  push:
    paths:
      - 'NOVAKIT-GitHub-Actions 2.zip'
      - 'NOVAKIT-GitHub-Actions.zip'
      - 'NOVAKIT-source.zip'

permissions:
  contents: read

jobs:
  build-ios:
    name: Build NOVAKIT unsigned IPA
    runs-on: macos-latest
    timeout-minutes: 35

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Locate and extract NOVAKIT source ZIP
        id: source
        shell: bash
        run: |
          set -euo pipefail

          ARCHIVE="$GITHUB_WORKSPACE/NOVAKIT-GitHub-Actions 2.zip"
          if [[ ! -f "$ARCHIVE" ]]; then
            ARCHIVE="$GITHUB_WORKSPACE/NOVAKIT-GitHub-Actions.zip"
          fi
          if [[ ! -f "$ARCHIVE" ]]; then
            ARCHIVE="$GITHUB_WORKSPACE/NOVAKIT-source.zip"
          fi
          if [[ ! -f "$ARCHIVE" ]]; then
            echo "ERROR: Updated NOVAKIT source ZIP not found in repository root."
            find "$GITHUB_WORKSPACE" -maxdepth 2 -type f -print
            exit 1
          fi

          EXTRACT_DIR="$RUNNER_TEMP/novakit-source"
          mkdir -p "$EXTRACT_DIR"
          ditto -x -k "$ARCHIVE" "$EXTRACT_DIR"

          PROJECT_PATH="$(find "$EXTRACT_DIR" -type d -name 'NOVAKIT.xcodeproj' -print -quit)"
          if [[ -z "$PROJECT_PATH" ]]; then
            echo "ERROR: NOVAKIT.xcodeproj not found in source ZIP."
            find "$EXTRACT_DIR" -maxdepth 5 -print
            exit 1
          fi

          PROJECT_DIR="$(dirname "$PROJECT_PATH")"
          echo "project_path=$PROJECT_PATH" >> "$GITHUB_OUTPUT"
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Using source archive: $ARCHIVE"
          echo "Using Xcode project: $PROJECT_PATH"

      - name: Validate project and scheme
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -version
          xcodebuild -list -project "${{ steps.source.outputs.project_path }}"
          plutil -lint "${{ steps.source.outputs.project_path }}/project.pbxproj"

      - name: Build for iPhone (unsigned)
        shell: bash
        run: |
          set -o pipefail
          xcodebuild \
            -project "${{ steps.source.outputs.project_path }}" \
            -scheme NOVAKIT \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/NOVAKIT-DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package unsigned IPA
        shell: bash
        run: |
          set -euo pipefail
          PRODUCTS="$RUNNER_TEMP/NOVAKIT-DerivedData/Build/Products/Release-iphoneos"
          APP_PATH="$(find "$PRODUCTS" -maxdepth 1 -type d -name '*.app' -print -quit)"
          if [[ -z "$APP_PATH" ]]; then
            echo "ERROR: Build succeeded but no .app product was found."
            ls -la "$PRODUCTS" || true
            exit 1
          fi

          mkdir -p "$RUNNER_TEMP/NOVAKIT-Package/Payload"
          ditto "$APP_PATH" "$RUNNER_TEMP/NOVAKIT-Package/Payload/$(basename "$APP_PATH")"
          cd "$RUNNER_TEMP/NOVAKIT-Package"
          /usr/bin/zip -qry "$GITHUB_WORKSPACE/NOVAKIT-unsigned.ipa" Payload
          test -s "$GITHUB_WORKSPACE/NOVAKIT-unsigned.ipa"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: NOVAKIT-unsigned-IPA
          path: NOVAKIT-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
